[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-steward"
version = "0.1.0"
description = "LLM data steward: documents a warehouse, classifies PII and answers lineage questions without seeing raw PII."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Justin Jang" }]
dependencies = [
  "duckdb>=1.1",
  "sqlglot>=25",
  "pyyaml>=6",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
metadata-steward = "metadata_steward.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 115

[tool.ruff.lint]
# Explicit rule set so results don't shift between ruff releases.
select = ["E", "F", "W", "B", "I", "UP"]
